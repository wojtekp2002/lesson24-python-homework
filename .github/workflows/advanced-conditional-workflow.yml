name: Advanced Conditional CI/CD

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

env:
  APP_NAME: lesson25-ci-cd
  PYTHON_VERSION: "3.11"
  ARTIFACT_RETENTION_DAYS: "7"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    env:
      APP_ENV: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Show build context
        run: |
          echo "Application: $APP_NAME"
          echo "Event: $GITHUB_EVENT_NAME"
          echo "Branch: $GITHUB_REF_NAME"

      - name: Run build script
        run: ./scripts/build.sh

      - name: Upload build artifact on main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-report-${{ github.sha }}
          path: dist/build-report.txt
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    env:
      APP_ENV: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Save test summary
        if: always()
        run: |
          mkdir -p dist
          {
            echo "Test summary"
            echo "Status: ${{ job.status }}"
            echo "Branch: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
          } > dist/test-summary.txt

      - name: Upload test artifact on main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-${{ github.sha }}
          path: dist/test-summary.txt
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  deploy:
    name: Deploy to prod
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test.result == 'success'
    environment: production
    env:
      APP_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Simulate production deployment
        run: ./scripts/deploy.sh

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-report-${{ github.sha }}
          path: dist/deploy-report.txt
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

  report:
    name: Workflow status report
    runs-on: ubuntu-latest
    needs:
      - build
      - test
      - deploy
    if: always()
    steps:
      - name: Print final status
        run: |
          echo "[${{ needs.build.result }}] Build"
          echo "[${{ needs.test.result }}] Test"
          echo "[${{ needs.deploy.result }}] Deploy to prod"

      - name: Explain skipped deployment
        if: needs.deploy.result == 'skipped'
        run: echo "Deploy is skipped unless this is a push to main."

      - name: Fail when build or tests failed
        if: needs.build.result != 'success' || needs.test.result != 'success'
        run: exit 1
